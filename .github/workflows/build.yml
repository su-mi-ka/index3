name: Build APK

on:
  push:
    branches:
      - claude/mobile-files-google-drive-sync-cx8ws8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 署名鍵は GitHub Secrets から受け取る（未設定なら debug 署名でビルド）。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      # Google サインインの登録に使う署名鍵の SHA-1 をログに出力する。
      - name: Print signing SHA-1 (register this in Google Cloud)
        if: env.KEYSTORE_PATH != ''
        run: |
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep -i "SHA1:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: index3-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 署名済みのときだけ、スマホから直接落とせる "latest" リリースに添付する。
      #   https://github.com/su-mi-ka/index3/releases/download/latest/app-release.apk
      - name: Publish to "latest" release
        if: env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド (latest)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
