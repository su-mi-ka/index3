name: Build APK

on:
  push:
    branches:
      - claude/mobile-files-google-drive-sync-cx8ws8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # このプロジェクトの Gradle 設定（AGP 8.1.0）と世代を合わせるためバージョンを固定。
          flutter-version: "3.24.5"
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: index3-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # スマホから直接ダウンロードしやすいよう "latest" リリースに添付する。
      #   https://github.com/su-mi-ka/index3/releases/download/latest/app-release.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド (latest)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
