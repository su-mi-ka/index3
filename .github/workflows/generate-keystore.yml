name: Generate signing keystore

# 署名鍵を GitHub 上で 1 回だけ生成するためのワークフロー（手動実行）。
# 生成物（keystore とその base64、SHA-1）をもとに、リポジトリの Secrets を設定する。
#
# ⚠️ 生成物には秘密鍵が含まれます。Actions の Artifact は
#    「リポジトリを閲覧できる人」がダウンロードできるため、
#    このワークフローは **プライベートリポジトリで実行**するか、
#    取得後すぐに該当の実行（run）を削除してください。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "キーのエイリアス"
        required: true
        default: "upload"
      store_password:
        description: "キーストアのパスワード（控えておくこと）"
        required: true
      key_password:
        description: "キーのパスワード（同じでも可）"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          ALIAS: ${{ inputs.alias }}
          STORE_PW: ${{ inputs.store_password }}
          KEY_PW: ${{ inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "CN=index3, OU=personal, O=index3, C=JP"
          base64 -w0 release.keystore > keystore.base64.txt

      - name: Show SHA-1 (register this in Google Cloud)
        env:
          ALIAS: ${{ inputs.alias }}
          STORE_PW: ${{ inputs.store_password }}
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -alias "$ALIAS" -storepass "$STORE_PW" | grep -i "SHA1:"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            release.keystore
            keystore.base64.txt
          if-no-files-found: error
