name: index3
description: 端末内のファイルをデータ形式ごとに分類してDropboxへ一括アップロードするAndroidアプリ。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Dropbox REST API / トークン取得のための HTTP 通信
  http: ^1.2.0
  # OAuth のブラウザ認証（PKCE フローのコールバック受け取り）
  flutter_web_auth_2: ^3.1.2
  # リフレッシュトークンの安全な保存
  flutter_secure_storage: ^9.2.2
  # PKCE の code_challenge 生成（SHA-256）
  crypto: ^3.0.3
  # ストレージアクセス権限の要求
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
