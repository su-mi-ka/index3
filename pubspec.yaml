name: index3
description: 端末内のファイルをデータ形式ごとに分類してGoogleドライブへ一括アップロードするAndroidアプリ。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Googleアカウントの選択・認証
  google_sign_in: ^6.2.1
  # google_sign_in の認証情報を googleapis 用の HTTP クライアントに変換する
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  # Google Drive REST API (v3)
  googleapis: ^13.2.0
  # ストレージアクセス権限の要求
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
